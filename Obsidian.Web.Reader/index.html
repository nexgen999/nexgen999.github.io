<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obsidian Web Reader</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://obsidian.md/favicon.ico">
    <link rel="apple-touch-icon" href="https://obsidian.md/favicon.ico">
    
    <!-- SEO -->
    <meta name="description" content="Obsidian Web Reader - Une interface élégante pour lire votre vault Obsidian en ligne.">
    
    <!-- Google Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Initial Fonts (Default) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet" id="dynamic-fonts">
    
    <!-- Styles -->
    <link rel="stylesheet" href="assets/themes.css">
    <link rel="stylesheet" href="assets/style.css">
    
    <!-- Prism Syntax Highlighting -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <!-- Mobile Header -->
    <header class="mobile-header">
        <button id="mobile-toggle" class="icon-btn">
            <i data-lucide="menu"></i>
        </button>
        <div style="display: flex; align-items: center; gap: 8px;">
            <img src="https://obsidian.md/favicon.ico" width="18" height="18" alt="Obsidian">
            <span style="font-weight: 700; font-size: 0.9rem; letter-spacing: 0.5px;">OBSIDIAN WEB</span>
        </div>
        <button id="open-settings-mobile" class="icon-btn">
            <i data-lucide="settings"></i>
        </button>
    </header>

    <aside id="sidebar">
        <div class="sidebar-header-main">
            <div class="logo-area">
                <img src="https://obsidian.md/favicon.ico" width="18" height="18" alt="Obsidian">
                <span>Web Reader</span>
            </div>
            <button class="settings-btn" id="open-settings" title="Paramètres">
                <i data-lucide="settings"></i>
            </button>
        </div>

        <div class="view-switcher">
            <button class="view-btn active" data-view="explorer" title="Explorateur">
                <i data-lucide="folder-tree"></i>
            </button>
            <button class="view-btn" data-view="cascade" title="Cascade">
                <i data-lucide="layout-list"></i>
            </button>
            <button class="view-btn" data-view="list" title="Liste">
                <i data-lucide="list"></i>
            </button>
        </div>

        <div class="sidebar-content" id="sidebar-content">
            <!-- Navigation will be injected here -->
        </div>

        <!-- Resize Handle -->
        <div id="resize-handle" class="resize-handle"></div>
    </aside>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <main>
        <div id="loader" class="loader"></div>
        <div class="content-container">
            <article id="markdown-content">
                <div style="padding: 20px; text-align: center; color: var(--text-muted);">
                    Chargement de votre vault...
                </div>
            </article>
        </div>
    </main>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3>Paramètres</h3>
                <button class="modal-close" id="close-settings"><i data-lucide="x"></i></button>
            </div>
            
            <div class="setting-group">
                <label class="setting-label">Thème</label>
                <div class="theme-selector">
                    <div class="theme-option" data-theme-val="dark">Dark</div>
                    <div class="theme-option" data-theme-val="dim">Dim</div>
                    <div class="theme-option" data-theme-val="antigravity">Antigravity</div>
                    <div class="theme-option" data-theme-val="light">Light</div>
                </div>
            </div>

            <div class="settings-flex">
                <div class="settings-col">
                    <label class="setting-label">Navigation (Menu)</label>
                    <div class="setting-subgroup">
                        <label>Police</label>
                        <select id="font-sidebar-select" class="setting-control"></select>
                    </div>
                    <div class="setting-subgroup">
                        <label>Taille (px)</label>
                        <input type="number" id="font-size-sidebar" class="setting-control" min="10" max="20" value="14">
                    </div>
                </div>
                <div class="settings-col">
                    <label class="setting-label">Lecture (Contenu)</label>
                    <div class="setting-subgroup">
                        <label>Police</label>
                        <select id="font-content-select" class="setting-control"></select>
                    </div>
                    <div class="setting-subgroup">
                        <label>Taille (px)</label>
                        <input type="number" id="font-size-content" class="setting-control" min="12" max="26" value="16">
                    </div>
                </div>
            </div>

            <div style="text-align: right; margin-top: 25px;">
                <button class="save-btn" id="save-settings">Enregistrer</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markdown.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js"></script>
    <script src="assets/app.js"></script>
</body>
</html>
