<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obsidian Web Viewer</title>
    
    <!-- SEO -->
    <meta name="description" content="Un lecteur de vault Obsidian statique élégant pour GitHub Pages.">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="assets/style.css">
    
    <!-- Prism Syntax Highlighting -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <aside id="sidebar">
        <div class="sidebar-header">
            <i data-lucide="book-open" style="color: var(--accent-color);"></i>
            <span>OBSIDIAN VAULT</span>
        </div>
        <div class="sidebar-content" id="sidebar-content">
            <!-- Navigation will be injected here -->
        </div>
    </aside>

    <main>
        <div id="loader" class="loader"></div>
        <div class="content-container">
            <article id="markdown-content">
                <!-- Content will be injected here -->
                <div style="padding: 20px; text-align: center; color: var(--text-muted);">
                    Chargement de votre vault...
                </div>
            </article>
        </div>
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markdown.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js"></script>
    <script src="assets/app.js"></script>
</body>
</html>
